name: CI

on:
  push:
  pull_request:

jobs:
  backend-and-eval-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pandas/pyarrow are not backend deps; the test suite imports them
          # transitively via scripts/build_contextual_chunks.py.
          pip install -r backend/requirements.txt pandas pyarrow pytest httpx

      - name: Compile key modules
        run: |
          python -m py_compile backend/main.py
          python -m py_compile scripts/run_eval_production.py
          python -m py_compile scripts/summarize_eval_results.py
          python -m py_compile VectorDB/qaEngine.py

      - name: Run smoke tests
        run: pytest tests -q

      - name: Run eval dry-run smoke check
        run: python scripts/run_eval_production.py --dry-run --max-cases 2 --dataset datasets/retrieval-goldens.jsonl
